<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-start-->
    __SEO_HEAD__
    <!--seo-end-->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f3efe5" />
    <link
      rel="icon"
      href="/assets/gc-mark-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="icon" href="/assets/gc-mark.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/manrope-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const saved = localStorage.getItem("gc-theme");
        const theme = saved === "dark" || saved === "light" ? saved : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#191e19" : "#f3efe5");
      })();
    </script>
    <style>
      .noscript-summary {
        max-width: 760px;
        padding: 10vh 24px;
        margin: auto;
        font-family: system-ui, sans-serif;
      }
      .noscript-summary a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <noscript>
      <main class="noscript-summary">
        <h1>Govind Charpe — Software engineering student</h1>
        <p>
          I build backend, full-stack, and cloud-native systems. GitAnalyzer is
          my strongest live product, and my reviewed open-source work includes
          CNCF Harbor CLI and Sugar Labs Music Blocks.
        </p>
        <p>
          Core tools include JavaScript, TypeScript, React, Go, REST APIs,
          PostgreSQL, Git, GitHub, and Docker.
        </p>
        <p>
          <a href="/resume.pdf">View résumé PDF</a> ·
          <a href="mailto:govind.charpe16@gmail.com">Contact me</a> ·
          <a href="https://github.com/gcharpe1604">GitHub</a>
        </p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
