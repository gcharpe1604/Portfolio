<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Govind Charpe builds software products and contributes reviewed changes to open-source engineering systems."
    />
    <meta name="theme-color" content="#0B0D0C" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        const saved = localStorage.getItem("gc-theme");
        const theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#0B0D0C" : "#F2EFE6");
      })();
    </script>
    <style>
      .noscript-summary {
        max-width: 760px;
        padding: 10vh 24px;
        margin: auto;
        font-family: system-ui, sans-serif;
      }
      .noscript-summary a {
        color: inherit;
      }
    </style>
    <title>Govind Charpe — Software Engineer</title>
  </head>

        <h1>Govind Charpe — Software engineering student</h1>

        </p>

    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
